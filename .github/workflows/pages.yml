name: Pages

# Publishes the report exactly as committed: docs/index.html is built by
# scripts/build_report.py from results/ and checked for staleness here and in CI.
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Report kit matches its pinned hashes
        run: python report-kit/check_kit.py
      - name: Committed report matches the committed results
        run: |
          python scripts/build_report.py
          git diff --exit-code -- docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
