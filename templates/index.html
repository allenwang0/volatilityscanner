<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volatility Scanner</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Volatility Scanner</h1>
    <div class="meta">
      <span>Source: <b id="source">connecting</b></span>
      <span>Spot: <b id="spot">-</b></span>
      <span>Tick: <b id="tick">-</b></span>
    </div>
    <div class="controls">
      <button type="button" id="pause" aria-pressed="false">Pause</button>
      <button type="button" id="theme">Theme</button>
      <a id="snapshot" href="/snapshot.json" download><button type="button" tabindex="-1">Snapshot</button></a>
    </div>
  </header>

  <div id="banner" class="banner" hidden role="status"></div>
  <p id="waiting">Waiting for first tick</p>

  <main id="views" class="grid" hidden>
    <section class="panel">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-smile" aria-selected="true">Smile per expiry</button>
        <button type="button" role="tab" id="tab-surface" aria-selected="false">Surface</button>
      </div>
      <div id="view-smile">
        <p class="takeaway" id="smile-takeaway"></p>
        <div id="smile" class="chart"></div>
        <ul id="failed" class="failed"></ul>
      </div>
      <div id="view-surface" hidden>
        <p class="takeaway" id="surface-takeaway"></p>
        <div id="surface" class="chart"></div>
      </div>
    </section>
    <section class="panel">
      <h2>ATM term structure</h2>
      <p class="takeaway" id="term-takeaway"></p>
      <div id="term" class="chart small"></div>
      <h2>25-delta skew</h2>
      <p class="takeaway" id="skew-takeaway"></p>
      <div id="skew" class="chart small"></div>
    </section>
    <section class="panel wide">
      <h2>Static arbitrage</h2>
      <div id="arb" class="table-wrap"></div>
    </section>
  </main>

  <script src="/static/charts.js"></script>
  <script src="/static/dashboard.js"></script>
</body>
</html>
